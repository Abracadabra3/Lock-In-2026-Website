<!DOCTYPE html>
<html>
    <head>
        <title>Lock-In 2067</title>
        <link rel="stylesheet" href="../index.css">
    </head>
    <body class="voicemail">
        <h1>My Voicemail</h1>
        <br>
        <h2>You have 1 new voicemail!</h2>
        <br>
        <button style="background-color: transparent; border: none;" type="button" id="voicemail" onclick="playVoicemail()">
            <img src="voicemail.png" style="width: 60%;">
        </button>

        <script>
            function playVoicemail() {
                // alert("Pressed!")
                const voicemail = new Audio('voicemail.mp3');
                voicemail.addEventListener('canplaythrough', () => {
                    voicemail.play()
                        .then(() => {
                            console.log("Audio started playing")
                        })

                        .catch(error => {
                            alert("Error: " + error)
                        })
                })

            }
        </script>
    </body>
</html>
