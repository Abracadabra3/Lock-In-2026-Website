<!DOCTYPE html>
<html>
    <head>
        <title>Concord Student Lock-In 2026</title>
        <link rel="stylesheet" href="index.css">
    </head>
    <body class="login">
        <div class="logintext">
            <h1>Voicemail</h1>
            <br>
            Enter your three-digit PIN:
            <p>
            <input type="text" id="answer" placeholder="Type answer here"/>
            <button onclick="getAnswer()">Submit</button>
            </p>
            <p>
            <button style="background-color: transparent; border: none; color: blue;" 
                onclick="forgotPassword()">I forgot my PIN!</button>
            </p>
        </div>
        <script>
            const input = document.getElementById("answer");
            input.addEventListener("keydown", function(event){
                if (event.key === "Enter") {
                    event.preventDefault();
                    getAnswer()
                }
            });

            function forgotPassword(){
                alert("Hint: Why was six afraid of seven?")
            }

            function getAnswer() {
                let answerInput = document.getElementById('answer');
                let answerValue = answerInput.value;
                if (answerValue == "789") {
                    alert("Correct!")
                    puzzle1Correct()
                }
                else {
                    alert("Incorrect. Try again!")
                }
            }
            function puzzle1Correct(){
                window.location.replace('https://abracadabra3.github.io/Lock-In-2026-Website/twothreefour/')
            }
        </script>
    </body>
</html>
